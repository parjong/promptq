[project]
name = "promptq"
dynamic = ["version"]
description = "A local queue that lets a Claude session on the same machine pick up prompts created by external processes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
promptq = "promptq.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from git tags (e.g. v0.1.0). _version.py is generated on build/sync and is not committed.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Without any tag this yields 0.0.1.dev5 instead of 0.1.dev5.
version_scheme = "python-simplified-semver"

[tool.hatch.build.hooks.vcs]
version-file = "src/promptq/_version.py"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
