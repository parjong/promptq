[project]
name = "promptq"
dynamic = ["version"]
description = "A local queue that lets a Claude session on the same machine pick up prompts created by external processes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
promptq = "promptq.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from git tags (e.g. v0.1.0). _version.py is generated on build/sync and is not committed.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Without any tag this yields 0.0.1.dev5 instead of 0.1.dev5.
version_scheme = "python-simplified-semver"

[tool.hatch.build.hooks.vcs]
version-file = "src/promptq/_version.py"

[dependency-groups]
# Dev tools are pinned exactly so local runs and CI behave the same.
# Keep ruff in sync with the ruff-pre-commit rev in .pre-commit-config.yaml.
dev = [
    "import-linter==2.15",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.importlinter]
root_package = "promptq"
include_external_packages = true
# models가 타입 힌트용으로만 naming을 가리키므로 TYPE_CHECKING import는 레이어 검사에서 제외한다
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "레이어: 위가 아래만 import한다"
type = "layers"
containers = ["promptq"]
layers = [
    "naming | home",
    "models | errors",
]
exhaustive = true
exhaustive_ignores = ["__main__"]

[[tool.importlinter.contracts]]
name = "무거운 외부 의존성 금지 (런타임 의존성 0)"
type = "forbidden"
source_modules = ["promptq"]
forbidden_modules = ["typer", "click", "rich", "pydantic"]
