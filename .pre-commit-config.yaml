repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      # Re-locks when pyproject.toml changed. Locally it updates uv.lock; in CI the modified
      # file makes the hook fail, so a stale uv.lock cannot be merged.
      - id: uv-lock
  - repo: local
    hooks:
      # Run through uv so the tool versions come from uv.lock, same as local runs and CI.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports --no-cache
        language: system
        pass_filenames: false
        always_run: true
      # `uv run` puts the project's bin directory on PATH, so scenarios call the real `promptq`.
      - id: prysk
        name: prysk (CLI scenarios)
        entry: env -u PROMPTQ_HOME -u XDG_STATE_HOME LC_ALL=C.UTF-8 uv run prysk tests/cli
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
      # README and tutorial examples are indented by four spaces so they render as code blocks and
      # run as tests. The numbered tutorial files are matched by glob, so sh -c expands it.
      - id: prysk-readme
        name: prysk (README and tutorial examples)
        entry: sh -c 'env -u PROMPTQ_HOME -u XDG_STATE_HOME LC_ALL=C.UTF-8 uv run prysk --indent=4 README.md guide/tutorial/[0-9]*.md'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
      # The Python example is a real script, so ruff and mypy check it and this hook runs it.
      - id: example-api
        name: example (Python API)
        entry: sh -c 'PROMPTQ_HOME="$(mktemp -d)/queue" uv run python guide/how_to_use_api.py'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
